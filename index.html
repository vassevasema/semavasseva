<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamarosan | Jánócsikné Vass Éva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F9F9F8;
      --cream-deep: #EFF1ED;
      --blush: #F0EAE6;
      --rose: #EAB8BE;
      --rose-deep: #D57A8A;
      --espresso: #3A3130;
      --ink: #5E5250;
    }
    body {
      margin: 0; padding: 0;
      background: radial-gradient(ellipse at 50% 50%, var(--cream) 0%, var(--blush) 100%);
      color: var(--espresso);
      font-family: 'Karla', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      padding: 60px 40px;
      border-radius: 32px;
      border: 1px solid rgba(213, 122, 138, 0.3);
      box-shadow: 0 16px 40px rgba(58, 49, 48, 0.08);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(36px, 5vw, 48px);
      color: var(--rose-deep);
      margin-bottom: 16px;
      font-weight: 500;
    }
    p {
      font-size: 18px;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.6;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: var(--rose-deep);
      margin: 32px auto;
    }
    .name {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      color: var(--espresso);
      margin-bottom: 4px;
    }
    .title {
      font-size: 14px;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hamarosan...</h1>
    <p>A weboldal jelenleg fejlesztés alatt áll.</p>
    <p>Kérjük, látogasson vissza később!</p>
    
    <div class="divider"></div>
    
    <div class="name">Jánócsikné Vass Éva</div>
    <div class="title">Pszichológus, ISST sématerápiás konzultáns</div>
  </div>
</body>
</html>
